[project]
name = "applications-visualizer"
version = "0.2.0"
description = "TI mmWave Industrial Visualizer (PySide6, Python 3.11)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.8",
    "pyopengl>=3.1.7",
    "numpy>=2.0",
    "pyserial>=3.5",
    "pyqtgraph>=0.13.7",
    "json-fix>=0.5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21,<7",
]
